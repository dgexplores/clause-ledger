[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "clause-ledger"
version = "1.0.0"
description = "Explainable supplier-document review with source evidence and versioned human decisions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "python-multipart>=0.0.20,<1", "pypdf>=6.21.2,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1"]
[tool.setuptools.package-data]
clause_ledger = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
