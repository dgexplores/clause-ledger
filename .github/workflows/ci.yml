name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check clause_ledger tests
      - run: pytest -q
      - run: python -m clause_ledger.evaluate --check
      - run: docker build -t clause-ledger:ci .
